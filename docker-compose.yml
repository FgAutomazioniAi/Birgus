services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    container_name: birgus_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: birgus
    ports:
      - "15433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d birgus"]
      interval: 5s
      timeout: 5s
      retries: 20

  garage:
    image: dxflrs/garage:v2.2.0
    container_name: birgus_garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}"
      GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is required}"
      GARAGE_METRICS_TOKEN: "${GARAGE_METRICS_TOKEN:?GARAGE_METRICS_TOKEN is required}"
      GARAGE_DEFAULT_ACCESS_KEY: "${GARAGE_S3_ACCESS_KEY_ID:?GARAGE_S3_ACCESS_KEY_ID is required}"
      GARAGE_DEFAULT_SECRET_KEY: "${GARAGE_S3_SECRET_ACCESS_KEY:?GARAGE_S3_SECRET_ACCESS_KEY is required}"
      GARAGE_DEFAULT_BUCKET: "${GARAGE_S3_BUCKET:?GARAGE_S3_BUCKET is required}"
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    ports:
      - "13900:3900"
      - "13901:3901"
      - "13903:3903"
    volumes:
      - ./garage/garage.local.toml:/etc/garage.toml:ro
      - ./garage/meta:/var/lib/garage/meta
      - ./garage/data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  python_modules:
    build:
      context: .
      dockerfile: python_modules/Dockerfile
    container_name: birgus_python_modules
    restart: unless-stopped
    environment:
      GARAGE_S3_ENDPOINT: "http://garage:3900"
      GARAGE_S3_REGION: "${GARAGE_S3_REGION:-garage}"
      GARAGE_S3_ACCESS_KEY_ID: "${GARAGE_S3_ACCESS_KEY_ID:?GARAGE_S3_ACCESS_KEY_ID is required}"
      GARAGE_S3_SECRET_ACCESS_KEY: "${GARAGE_S3_SECRET_ACCESS_KEY:?GARAGE_S3_SECRET_ACCESS_KEY is required}"
      GARAGE_S3_FORCE_PATH_STYLE: "${GARAGE_S3_FORCE_PATH_STYLE:-true}"
      MAIL_PROVIDER: "${MAIL_PROVIDER:-smtp}"
      MAIL_FROM: "${MAIL_FROM:-${SMTP_FROM:-}}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      AI_PROVIDER_BASE_URL: "${AI_PROVIDER_BASE_URL:-http://internal-ai-vllm:8000/v1}"
      AI_PROVIDER_API_KEY: "${AI_PROVIDER_API_KEY:-${VLLM_API_KEY:-}}"
      AI_PROVIDER_CHAT_MODEL: "${AI_PROVIDER_CHAT_MODEL:-birgus-vl}"
      AI_PROVIDER_COMPLETIONS_PATH: "${AI_PROVIDER_COMPLETIONS_PATH:-/v1/chat/completions}"
      AI_PROVIDER_TIMEOUT_MS: "${AI_PROVIDER_TIMEOUT_MS:-600000}"
      AI_PROVIDER_TEMPERATURE: "${AI_PROVIDER_TEMPERATURE:-0}"
      AI_PROVIDER_MAX_OUTPUT_TOKENS: "${AI_PROVIDER_MAX_OUTPUT_TOKENS:-800}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      MEASURE_REPORT_ANALYSIS_MODE: "${MEASURE_REPORT_ANALYSIS_MODE:-auto}"
      MEASURE_REPORT_MAX_PAGES: "${MEASURE_REPORT_MAX_PAGES:-}"
      MEASURE_REPORT_RENDER_SCALE: "${MEASURE_REPORT_RENDER_SCALE:-2.0}"
      MEASURE_REPORT_MAX_IMAGE_SIZE: "${MEASURE_REPORT_MAX_IMAGE_SIZE:-1800}"
    depends_on:
      garage:
        condition: service_healthy
    extra_hosts:
      - "internal-ai-vllm:host-gateway"
    expose:
      - "8200"

  ocr_engine:
    build:
      context: .
      dockerfile: ocr_service/Dockerfile
    container_name: birgus_ocr_engine
    restart: unless-stopped
    environment:
      GARAGE_S3_ENDPOINT: "http://garage:3900"
      GARAGE_S3_REGION: "${GARAGE_S3_REGION:-garage}"
      GARAGE_S3_ACCESS_KEY_ID: "${GARAGE_S3_ACCESS_KEY_ID:?GARAGE_S3_ACCESS_KEY_ID is required}"
      GARAGE_S3_SECRET_ACCESS_KEY: "${GARAGE_S3_SECRET_ACCESS_KEY:?GARAGE_S3_SECRET_ACCESS_KEY is required}"
      GARAGE_S3_FORCE_PATH_STYLE: "${GARAGE_S3_FORCE_PATH_STYLE:-true}"
      OCR_ENGINE_LANG: "${OCR_ENGINE_LANG:-it}"
      PADDLEOCR_HOME: "/app/storage/paddleocr_cache"
      PADDLE_PDX_CACHE_HOME: "/app/storage/paddleocr_cache/paddlex_cache"
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./ocr_service/storage:/app/storage
    expose:
      - "8201"

  ocr_lifecycle:
    build:
      context: .
      dockerfile: ocr_lifecycle/Dockerfile
    container_name: birgus_ocr_lifecycle
    restart: unless-stopped
    environment:
      OCR_LIFECYCLE_TOKEN: "${OCR_LIFECYCLE_TOKEN:?OCR_LIFECYCLE_TOKEN is required}"
      OCR_TARGET_CONTAINER: "birgus_ocr_engine"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8202"

  vllm_lifecycle:
    build:
      context: .
      dockerfile: vllm_lifecycle/Dockerfile
    container_name: birgus_vllm_lifecycle
    profiles: ["ai-runtime"]
    restart: unless-stopped
    environment:
      VLLM_LIFECYCLE_TOKEN: "${VLLM_LIFECYCLE_TOKEN:-}"
      VLLM_TARGET_CONTAINER: "birgus_vllm"
      VLLM_COMPOSE_FILE: "/workspace/docker-compose.yml"
      VLLM_RUNTIME_ENV_FILE: "/workspace/vllm/runtime.env"
      VLLM_COMPOSE_PROJECT: "birgus"
      VLLM_COMPOSE_PROFILE: "ai-runtime"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
      - ./vllm:/workspace/vllm
    expose:
      - "8203"

  vllm:
    build:
      context: .
      dockerfile: vllm/Dockerfile
    container_name: birgus_vllm
    profiles: ["ai-runtime"]
    restart: unless-stopped
    env_file:
      - ./vllm/runtime.env
    volumes:
      - ./vllm/model-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: birgus_app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/birgus?schema=public
      BIRGUS_SEED_PASSWORD: "${BIRGUS_SEED_PASSWORD:?BIRGUS_SEED_PASSWORD is required}"
      AUTH_PEPPER: "${AUTH_PEPPER:?AUTH_PEPPER is required}"
      AUTH_SESSION_HOURS: "${AUTH_SESSION_HOURS:-12}"
      AUTH_SESSION_REMEMBER_DAYS: "${AUTH_SESSION_REMEMBER_DAYS:-30}"
      AUTH_PASSWORD_RESET_CODE_TTL_MINUTES: "${AUTH_PASSWORD_RESET_CODE_TTL_MINUTES:-15}"
      AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME:-vl_session}"
      AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN:-}"
      AUTH_COOKIE_PATH: "${AUTH_COOKIE_PATH:-/}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_COOKIE_SAME_SITE: "${AUTH_COOKIE_SAME_SITE:-Lax}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      AI_PROVIDER: "${AI_PROVIDER:-vllm}"
      AI_PROVIDER_BASE_URL: "${AI_PROVIDER_BASE_URL:-http://internal-ai-vllm:8000/v1}"
      AI_PROVIDER_API_KEY: "${AI_PROVIDER_API_KEY:-${VLLM_API_KEY:-}}"
      AI_PROVIDER_CHAT_MODEL: "${AI_PROVIDER_CHAT_MODEL:-birgus-vl}"
      AI_PROVIDER_EMBEDDING_MODEL: "${AI_PROVIDER_EMBEDDING_MODEL:-${KNOWLEDGE_EMBEDDING_MODEL:-}}"
      AI_PROVIDER_COMPLETIONS_PATH: "${AI_PROVIDER_COMPLETIONS_PATH:-/v1/chat/completions}"
      AI_PROVIDER_MODELS_PATH: "${AI_PROVIDER_MODELS_PATH:-/v1/models}"
      AI_PROVIDER_TIMEOUT_MS: "${AI_PROVIDER_TIMEOUT_MS:-600000}"
      AI_PROVIDER_TEMPERATURE: "${AI_PROVIDER_TEMPERATURE:-0}"
      AI_PROVIDER_MAX_OUTPUT_TOKENS: "${AI_PROVIDER_MAX_OUTPUT_TOKENS:-512}"
      MAIL_PROVIDER: "${MAIL_PROVIDER:-smtp}"
      MAIL_FROM: "${MAIL_FROM:-${SMTP_FROM:-}}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      MEASURE_REPORT_ANALYSIS_MODE: "${MEASURE_REPORT_ANALYSIS_MODE:-auto}"
      PYTHON_MODULES_BASE_URL: "${PYTHON_MODULES_BASE_URL:-http://python_modules:8200}"
      PYTHON_MODULES_EXECUTE_PATH: "${PYTHON_MODULES_EXECUTE_PATH:-/v1/modules/execute}"
      PYTHON_MODULES_TIMEOUT_MS: "${PYTHON_MODULES_TIMEOUT_MS:-180000}"
      OCR_ENGINE_BASE_URL: "${OCR_ENGINE_BASE_URL:-http://ocr_engine:8201}"
      OCR_ENGINE_EXECUTE_PATH: "${OCR_ENGINE_EXECUTE_PATH:-/v1/modules/execute}"
      OCR_ENGINE_TIMEOUT_MS: "${OCR_ENGINE_TIMEOUT_MS:-180000}"
      OCR_LIFECYCLE_BASE_URL: "${OCR_LIFECYCLE_BASE_URL:-http://ocr_lifecycle:8202}"
      OCR_LIFECYCLE_TOKEN: "${OCR_LIFECYCLE_TOKEN:?OCR_LIFECYCLE_TOKEN is required}"
      VLLM_LIFECYCLE_BASE_URL: "${VLLM_LIFECYCLE_BASE_URL:-http://vllm_lifecycle:8203}"
      VLLM_LIFECYCLE_TOKEN: "${VLLM_LIFECYCLE_TOKEN:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:-}"
      ORCH_DDT_LM_MAX_TOKENS: "${ORCH_DDT_LM_MAX_TOKENS:-700}"
      ORCH_DDT_USE_JSON_SCHEMA: "${ORCH_DDT_USE_JSON_SCHEMA:-true}"
      KNOWLEDGE_EMBEDDING_PROVIDER: "${KNOWLEDGE_EMBEDDING_PROVIDER:-local-hash}"
      KNOWLEDGE_EMBEDDING_DIMENSIONS: "${KNOWLEDGE_EMBEDDING_DIMENSIONS:-256}"
      KNOWLEDGE_EMBEDDING_MODEL: "${KNOWLEDGE_EMBEDDING_MODEL:-}"
      KNOWLEDGE_LM_EMBEDDINGS_PATH: "${KNOWLEDGE_LM_EMBEDDINGS_PATH:-/v1/embeddings}"
      KNOWLEDGE_SEARCH_TOP_K: "${KNOWLEDGE_SEARCH_TOP_K:-5}"
      GARAGE_S3_ENDPOINT: "http://garage:3900"
      GARAGE_S3_REGION: "${GARAGE_S3_REGION:-garage}"
      GARAGE_S3_BUCKET: "${GARAGE_S3_BUCKET:?GARAGE_S3_BUCKET is required}"
      GARAGE_S3_ACCESS_KEY_ID: "${GARAGE_S3_ACCESS_KEY_ID:?GARAGE_S3_ACCESS_KEY_ID is required}"
      GARAGE_S3_SECRET_ACCESS_KEY: "${GARAGE_S3_SECRET_ACCESS_KEY:?GARAGE_S3_SECRET_ACCESS_KEY is required}"
      GARAGE_S3_FORCE_PATH_STYLE: "${GARAGE_S3_FORCE_PATH_STYLE:-true}"
      GARAGE_STORAGE_PREFIX: "${GARAGE_STORAGE_PREFIX:-projects}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "internal-ai-vllm:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      python_modules:
        condition: service_started
      ocr_engine:
        condition: service_started
      ocr_lifecycle:
        condition: service_started
    ports:
      - "13001:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: birgus_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BIRGUS_API_BASE_URL: http://app:3000
      AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME:-vl_session}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "13100:3100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  reverse_proxy:
    image: caddy:2.8-alpine
    container_name: birgus_reverse_proxy
    restart: unless-stopped
    ports:
      - "${BIRGUS_HOST_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_started
      app:
        condition: service_healthy

volumes: {}
