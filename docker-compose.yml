services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    container_name: birgus_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: birgus
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d birgus"]
      interval: 5s
      timeout: 5s
      retries: 20

  garage:
    image: dxflrs/garage:v2.2.0
    container_name: birgus_garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}"
      GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is required}"
      GARAGE_METRICS_TOKEN: "${GARAGE_METRICS_TOKEN:?GARAGE_METRICS_TOKEN is required}"
      GARAGE_DEFAULT_ACCESS_KEY: "${GARAGE_S3_ACCESS_KEY_ID:?GARAGE_S3_ACCESS_KEY_ID is required}"
      GARAGE_DEFAULT_SECRET_KEY: "${GARAGE_S3_SECRET_ACCESS_KEY:?GARAGE_S3_SECRET_ACCESS_KEY is required}"
      GARAGE_DEFAULT_BUCKET: "${GARAGE_S3_BUCKET:?GARAGE_S3_BUCKET is required}"
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3903:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./garage/meta:/var/lib/garage/meta
      - ./garage/data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  python_modules:
    build:
      context: .
      dockerfile: python_modules/Dockerfile
    container_name: birgus_python_modules
    restart: unless-stopped
    environment:
      GARAGE_S3_ENDPOINT: "http://garage:3900"
      GARAGE_S3_REGION: "${GARAGE_S3_REGION:-garage}"
      GARAGE_S3_ACCESS_KEY_ID: "${GARAGE_S3_ACCESS_KEY_ID:?GARAGE_S3_ACCESS_KEY_ID is required}"
      GARAGE_S3_SECRET_ACCESS_KEY: "${GARAGE_S3_SECRET_ACCESS_KEY:?GARAGE_S3_SECRET_ACCESS_KEY is required}"
      GARAGE_S3_FORCE_PATH_STYLE: "${GARAGE_S3_FORCE_PATH_STYLE:-true}"
      OCR_ENGINE_LANG: "${OCR_ENGINE_LANG:-it}"
      PADDLEOCR_HOME: "/app/storage/paddleocr_cache"
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./python_modules/storage:/app/storage
    expose:
      - "8200"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: birgus_app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/birgus?schema=public
      AUTH_PEPPER: "${AUTH_PEPPER:?AUTH_PEPPER is required}"
      AUTH_SESSION_HOURS: "${AUTH_SESSION_HOURS:-12}"
      AUTH_SESSION_REMEMBER_DAYS: "${AUTH_SESSION_REMEMBER_DAYS:-30}"
      AUTH_PASSWORD_RESET_CODE_TTL_MINUTES: "${AUTH_PASSWORD_RESET_CODE_TTL_MINUTES:-15}"
      AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME:-vl_session}"
      AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN:-}"
      AUTH_COOKIE_PATH: "${AUTH_COOKIE_PATH:-/}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_COOKIE_SAME_SITE: "${AUTH_COOKIE_SAME_SITE:-Lax}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      SMTP_HOST: "${SMTP_HOST:?SMTP_HOST is required}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:?SMTP_USER is required}"
      SMTP_PASS: "${SMTP_PASS:?SMTP_PASS is required}"
      SMTP_FROM: "${SMTP_FROM:?SMTP_FROM is required}"
      DDT_READER_LM_MODEL: "${DDT_READER_LM_MODEL:?DDT_READER_LM_MODEL is required}"
      DDT_READER_LM_BASE_URL: "${DDT_READER_LM_BASE_URL:?DDT_READER_LM_BASE_URL is required}"
      DDT_READER_LM_CHAT_PATH: "${DDT_READER_LM_CHAT_PATH:?DDT_READER_LM_CHAT_PATH is required}"
      DDT_READER_LM_MODELS_PATH: "${DDT_READER_LM_MODELS_PATH:?DDT_READER_LM_MODELS_PATH is required}"
      DDT_READER_LM_TIMEOUT_MS: "${DDT_READER_LM_TIMEOUT_MS:-45000}"
      DDT_READER_LM_MAX_PDF_TEXT_CHARS: "${DDT_READER_LM_MAX_PDF_TEXT_CHARS:-20000}"
      DDT_READER_ORCHESTRATOR_BASE_URL: "${DDT_READER_ORCHESTRATOR_BASE_URL:?DDT_READER_ORCHESTRATOR_BASE_URL is required}"
      DDT_READER_ORCHESTRATOR_EXECUTE_PATH: "${DDT_READER_ORCHESTRATOR_EXECUTE_PATH:-/api/orchestrator/modules/execute}"
      DDT_READER_ORCHESTRATOR_TIMEOUT_MS: "${DDT_READER_ORCHESTRATOR_TIMEOUT_MS:-600000}"
      ORCHESTRATOR_INTERNAL_TOKEN: "${ORCHESTRATOR_INTERNAL_TOKEN:-}"
      PYTHON_MODULES_BASE_URL: "${PYTHON_MODULES_BASE_URL:-http://python_modules:8200}"
      PYTHON_MODULES_EXECUTE_PATH: "${PYTHON_MODULES_EXECUTE_PATH:-/v1/modules/execute}"
      PYTHON_MODULES_TIMEOUT_MS: "${PYTHON_MODULES_TIMEOUT_MS:-180000}"
      ORCH_LM_BASE_URL: "${ORCH_LM_BASE_URL:?ORCH_LM_BASE_URL is required}"
      ORCH_LM_COMPLETIONS_PATH: "${ORCH_LM_COMPLETIONS_PATH:-/v1/chat/completions}"
      ORCH_LM_MODEL: "${ORCH_LM_MODEL:?ORCH_LM_MODEL is required}"
      ORCH_LM_TIMEOUT_MS: "${ORCH_LM_TIMEOUT_MS:-600000}"
      ORCH_LM_TEMPERATURE: "${ORCH_LM_TEMPERATURE:-0}"
      KNOWLEDGE_EMBEDDING_PROVIDER: "${KNOWLEDGE_EMBEDDING_PROVIDER:-local-hash}"
      KNOWLEDGE_EMBEDDING_DIMENSIONS: "${KNOWLEDGE_EMBEDDING_DIMENSIONS:-256}"
      KNOWLEDGE_EMBEDDING_MODEL: "${KNOWLEDGE_EMBEDDING_MODEL:-}"
      KNOWLEDGE_LM_EMBEDDINGS_PATH: "${KNOWLEDGE_LM_EMBEDDINGS_PATH:-/v1/embeddings}"
      KNOWLEDGE_SEARCH_TOP_K: "${KNOWLEDGE_SEARCH_TOP_K:-5}"
      GARAGE_S3_ENDPOINT: "http://garage:3900"
      GARAGE_S3_REGION: "${GARAGE_S3_REGION:-garage}"
      GARAGE_S3_BUCKET: "${GARAGE_S3_BUCKET:?GARAGE_S3_BUCKET is required}"
      GARAGE_S3_ACCESS_KEY_ID: "${GARAGE_S3_ACCESS_KEY_ID:?GARAGE_S3_ACCESS_KEY_ID is required}"
      GARAGE_S3_SECRET_ACCESS_KEY: "${GARAGE_S3_SECRET_ACCESS_KEY:?GARAGE_S3_SECRET_ACCESS_KEY is required}"
      GARAGE_S3_FORCE_PATH_STYLE: "${GARAGE_S3_FORCE_PATH_STYLE:-true}"
      GARAGE_STORAGE_PREFIX: "${GARAGE_STORAGE_PREFIX:-projects}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      python_modules:
        condition: service_started
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: birgus_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      BIRGUS_API_BASE_URL: http://app:3000
      AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME:-vl_session}"
      PYTHON_MODULES_BASE_URL: "${PYTHON_MODULES_BASE_URL:-http://python_modules:8200}"
      PYTHON_MODULES_EXECUTE_PATH: "${PYTHON_MODULES_EXECUTE_PATH:-/v1/modules/execute}"
      PYTHON_MODULES_TIMEOUT_MS: "${PYTHON_MODULES_TIMEOUT_MS:-180000}"
      ORCH_LM_BASE_URL: "${ORCH_LM_BASE_URL:?ORCH_LM_BASE_URL is required}"
      ORCH_LM_CHAT_PATH: "${ORCH_LM_CHAT_PATH:-/api/v1/chat}"
      ORCH_LM_COMPLETIONS_PATH: "${ORCH_LM_COMPLETIONS_PATH:-/v1/chat/completions}"
      ORCH_LM_MODELS_PATH: "${ORCH_LM_MODELS_PATH:-/api/v1/models}"
      ORCH_LM_MODEL: "${ORCH_LM_MODEL:?ORCH_LM_MODEL is required}"
      ORCH_LM_TIMEOUT_MS: "${ORCH_LM_TIMEOUT_MS:-600000}"
      ORCH_LM_TEMPERATURE: "${ORCH_LM_TEMPERATURE:-0}"
      ORCH_DDT_LM_MAX_TOKENS: "${ORCH_DDT_LM_MAX_TOKENS:-700}"
      ORCH_DDT_DISABLE_PROMPT_CACHE: "${ORCH_DDT_DISABLE_PROMPT_CACHE:-true}"
      ORCH_DDT_USE_JSON_SCHEMA: "${ORCH_DDT_USE_JSON_SCHEMA:-true}"
      ORCHESTRATOR_INTERNAL_TOKEN: "${ORCHESTRATOR_INTERNAL_TOKEN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_started
      python_modules:
        condition: service_started
    ports:
      - "3100:3100"

volumes: {}
