services:
  reverse_proxy:
    image: caddy:2.8-alpine
    container_name: birgus_reverse_proxy
    restart: unless-stopped
    environment:
      BIRGUS_PUBLIC_HOST: "${BIRGUS_PUBLIC_HOST:?BIRGUS_PUBLIC_HOST is required}"
    ports: !override
      - "${BIRGUS_HOST_HTTP_PORT:-80}:80"
      - "${BIRGUS_HOST_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile.https.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      app:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:

