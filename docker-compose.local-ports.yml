services:
  postgres:
    ports: !override
      - "${BIRGUS_HOST_DB_PORT:-5433}:5432"

  app:
    ports: !override
      - "${BIRGUS_HOST_API_PORT:-3001}:3000"

  frontend:
    ports: !override
      - "${BIRGUS_HOST_FRONTEND_PORT:-3100}:3100"

  garage:
    ports: !override
      - "${BIRGUS_HOST_GARAGE_S3_PORT:-3900}:3900"
      - "${BIRGUS_HOST_GARAGE_RPC_PORT:-3901}:3901"
      - "${BIRGUS_HOST_GARAGE_ADMIN_PORT:-3903}:3903"
